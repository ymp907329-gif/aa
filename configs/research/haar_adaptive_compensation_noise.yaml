data:
  root: "./data/MSRS"
  train_split: "train"
  val_split: null
  test_split: "test"
  exclude_test_overlap: true
  split_seed: 42
  val_ratio: 0.1
  size: 256
  batch_size: 2
  num_workers: 0
  augmentation:
    flip_probability: 0.5
    gaussian_noise: true
    noise_probability: 0.35
    noise_sigma_min: 0.01
    noise_sigma_max: 0.03

model:
  base_ch: 64
  in_ch: 1
  use_aid: true
  use_dfd: true
  use_skip: true
  use_source_reconstruction: true
  use_adaptive_compensation: true
  compensation:
    hidden_channels: 16
    beta_max: 1.0
    output_scale: 1.3
    noise_kernel: 5
  aid:
    max_steps: 4
    min_steps: 2
    residual_tol: 0.05
    consistency_tol: 0.5
    diffusion_step: 0.12
    kappa: 0.25
    region_adaptive: true
    stop_kernel: 5
  dfd:
    wavelet: "haar"
    max_offset: 2.0

train:
  epochs: 15
  lr: 5.0e-6
  weight_decay: 1.0e-4
  save_dir: "./checkpoints/research/haar_adaptive_compensation_noise"
  log_dir: "./logs/research/haar_adaptive_compensation_noise"
  save_freq: 5
  log_freq: 20
  patience: 6
  selection_metric: "qabf"
  seed: 42
  init_from: "./checkpoints/research/haar_adaptive_compensation/best.pth"
  init_strict: true

loss:
  intensity_mode: "max"
  lambda_pixel: 1.0
  lambda_gradient: 2.0
  lambda_ssim: 2.0
  lambda_freqcl: 0.01
  lambda_offset: 0.01
  lambda_source_reconstruction: 0.5
  gradient_mode: "vector"
  lambda_orientation: 0.2
  temperature: 0.2
  wavelet_levels: 2
